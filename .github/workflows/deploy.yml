name: Build & Deploy to Beget

# Собирает Astro в GitHub Actions и заливает готовый dist/ на Beget по SSH (rsync).
# Триггер — push в main. Можно запустить и вручную (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ to Beget via rsync over SSH
        env:
          SSH_KEY:  ${{ secrets.BEGET_SSH_KEY }}
          SSH_HOST: ${{ secrets.BEGET_SSH_HOST }}
          SSH_USER: ${{ secrets.BEGET_SSH_USER }}
          SSH_PORT: ${{ secrets.BEGET_SSH_PORT }}
          TARGET:   ${{ secrets.BEGET_TARGET_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # --delete синхронизирует «как в dist/»: удалённые файлы уедут и с сервера.
          rsync -avz --delete \
            -e "ssh -p $PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$TARGET/"
          echo "✅ Задеплоено в $TARGET"
